💡 Цены формируются на основе ежедневного мониторинга элеваторов Костанайской области.
      </div>

      <button onclick="closeChartModal()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 rounded-2xl text-xs shadow-md">
        Понятно, закрыть
      </button>
    </div>
  </div>

  <!-- ================= НИЖНЯЯ НАВИГАЦИЯ (FOOTER) ================= -->
  <nav id="farmer-nav" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 px-6 py-2.5 z-40 flex justify-around items-center">
    <button onclick="goToScreen('screen-mills')" id="nav-mills" class="flex flex-col items-center gap-1 text-brand-500 font-bold">
      <i data-lucide="building-2" class="w-5 h-5"></i>
      <span class="text-[10px]">Закупщики</span>
    </button>
    <button onclick="goToScreen('screen-orders')" id="nav-orders" class="flex flex-col items-center gap-1 text-gray-400 font-medium hover:text-gray-600">
      <i data-lucide="clipboard-list" class="w-5 h-5"></i>
      <span class="text-[10px]">Мои заявки</span>
    </button>
  </nav>

  <!-- ================= SCRIPTS & LOGIC ================= -->
  <script>
    // -------------------------------------------------------------
    // 1. ИНИЦИАЛИЗАЦИЯ TELEGRAM И SUPABASE
    // -------------------------------------------------------------
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Инициализация Supabase (замени на свои ключи при необходимости)
    const SUPABASE_URL = 'https://your-supabase-url.supabase.co';
    const SUPABASE_KEY = 'your-anon-key';
    let db = null;
    
    if (window.supabase) {
      try {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } catch (e) {
        console.warn('Supabase не подключен, переключение в оффлайн-режим (демо)');
      }
    }

    // Инициализация Lucide иконок
    lucide.createIcons();

    // -------------------------------------------------------------
    // 2. ДЕМО-ДАННЫЕ (MOCK DATA)
    // -------------------------------------------------------------
    let currentRole = 'farmer';
    let selectedMill = null;
    let currentCropFilter = 'ALL';
    let currentSort = 'price';
    let activeLabOrder = null;
    let activeMillOrder = null;

    const mockMills = [
      {
        id: '1',
        name: 'ТОО «Аруана-2010»',
        location: 'г. Костанай, ул. Элеваторная 4',
        region: 'Kostanay',
        distance: 12,
        crop: 'Пшеница 3',
        gluten: '25-27%',
        price: 92000,
        queueTime: '15-20 мин',
        speedScore: 3,
        workingHours: '08:00 - 20:00',
        phone: '+7 (7142) 55-44-33',
        priceHistory: [88000, 89500, 90000, 91500, 92000]
      },
      {
        id: '2',
        name: 'ТОО «Сарыколь-Зерно»',
        location: 'п. Сарыколь, промзона',
        region: 'Sarykol',
        distance: 5,
        crop: 'Пшеница 3',
        gluten: '23-25%',
        price: 90500,
        queueTime: 'Без очереди',
        speedScore: 1,
        workingHours: 'Круглосуточно',
        phone: '+7 (777) 123-45-67',
        priceHistory: [87000, 88000, 89000, 90000, 90500]
      },
      {
        id: '3',
        name: 'ТОО «Карасу-Астык»',
        location: 'c. Карасу, ул. Вокзальная 1',
        region: 'Karasu',
        distance: 45,
        crop: 'Пшеница 4',
        gluten: '18-22%',
        price: 81000,
        queueTime: '30-40 мин',
        speedScore: 4,
        workingHours: '09:00 - 18:00',
        phone: '+7 (7145) 2-11-00',
        priceHistory: [79000, 79500, 80000, 80500, 81000]
      },
      {
        id: '4',
        name: 'Мелькомбинат Федоровка',
        location: 'c. Федоровка',
        region: 'Fedorovka',
        distance: 28,
        crop: 'Ячмень',
        gluten: '-',
        price: 65000,
        queueTime: '10 мин',
        speedScore: 2,
        workingHours: '08:00 - 19:00',
        phone: '+7 (771) 987-65-43',
        priceHistory: [62000, 63000, 64000, 64500, 65000]
      }
    ];

    let orders = [
      {
        id: 'ORD-9021',
        millName: 'ТОО «Аруана-2010»',
        crop: 'Пшеница 3',
        price: 92000,
        volume: 60,
        totalPayout: 5520000,
        farmerName: 'КХ «Журавлев»',
        farmerPhone: '+7 (777) 321-99-88',
        location: 'Ток №2 (Сарыкольский р-н)',
        status: 'PENDING_LAB', // PENDING_LAB -> READY_FOR_WEIGH -> COMPLETED
        createdAt: '16.10.2026 14:20',
        labData: null,
        weighingData: null
      }
    ];

    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', () => {
      // Имя пользователя из Telegram
      if (tg?.initDataUnsafe?.user) {
        const u = tg.initDataUnsafe.user;
        document.getElementById('header-user-badge').innerText = `${u.first_name || 'Фермер'} • Костанайская обл.`;
        document.getElementById('farmer-name-input').value = `${u.first_name || ''} ${u.last_name || ''}`.trim();
      }
      
      renderMills();
      renderOrders();
      renderLabOrders();
      renderMillOrders();
    });

    // -------------------------------------------------------------
    // 3. НАВИГАЦИЯ И ПЕРЕКЛЮЧЕНИЕ РОЛЕЙ
    // -------------------------------------------------------------
    function goToScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(screenId);
      if (target) target.classList.add('active');

      // Обновление навигации
      const navMills = document.getElementById('nav-mills');
      const navOrders = document.getElementById('nav-orders');
      
      if (screenId === 'screen-mills') {
        navMills.className = 'flex flex-col items-center gap-1 text-brand-500 font-bold';
        navOrders.className = 'flex flex-col items-center gap-1 text-gray-400 font-medium hover:text-gray-600';
      } else if (screenId === 'screen-orders') {
        navOrders.className = 'flex flex-col items-center gap-1 text-brand-500 font-bold';
        navMills.className = 'flex flex-col items-center gap-1 text-gray-400 font-medium hover:text-gray-600';
      }
      window.scrollTo(0, 0);
    }

    function switchAppRole(role) {
      currentRole = role;
      const farmerNav = document.getElementById('farmer-nav');
      
      if (role === 'farmer') {
        farmerNav.style.display = 'flex';
        goToScreen('screen-mills');
      } else if (role === 'lab') {
        farmerNav.style.display = 'none';
        goToScreen('screen-lab-panel');
        renderLabOrders();
      } else if (role === 'mill') {
        farmerNav.style.display = 'none';
        goToScreen('screen-mill-panel');
        renderMillOrders();
      }
    }

    // -------------------------------------------------------------
    // 4. ЭКРАН ФЕРМЕРА: РЕНДЕР И ФИЛЬТРАЦИЯ МЕЛЬНИЦ
    // -------------------------------------------------------------
    function renderMills() {
      const container = document.getElementById('mills-list');
      let filtered = [...mockMills];

      if (currentCropFilter !== 'ALL') {
        filtered = filtered.filter(m => m.crop === currentCropFilter);
      }

      if (currentSort === 'price') {
        filtered.sort((a, b) => b.price - a.price);
      } else if (currentSort === 'distance') {
        filtered.sort((a, b) => a.distance - b.distance);
      } else if (currentSort === 'speed') {
        filtered.sort((a, b) => a.speedScore - b.speedScore);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-8 text-xs">По данному фильтру закупщиков не найдено.</div>`;
        return;
      }

      container.innerHTML = filtered.map(m => `
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition-shadow space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <span class="inline-block bg-brand-50 text-brand-700 text-[10px] font-extrabold px-2 py-0.5 rounded-md mb-1">${m.crop} • Клейковина: ${m.gluten}</span>
              <h3 class="font-extrabold text-sm text-gray-900">${m.name}</h3>
              <p class="text-[11px] text-gray-400 flex items-center gap-1 mt-0.5">
                <i data-lucide="map-pin" class="w-3 h-3 text-gray-400"></i> ${m.location} (${m.distance} км)
              </p>
            </div>
            <button onclick="openChartModal('${m.name}', ${m.price}) text-right">
              <div class="text-base font-black text-brand-600">${m.price.toLocaleString()} ₸</div>
              <div class="text-[10px] text-gray-400 flex items-center justify-end gap-0.5">
                <i data-lucide="trending-up" class="w-3 h-3 text-emerald-500"></i> График цен
              </div>
            </button>
          </div>

          <div class="flex items-center justify-between text-[11px] bg-gray-50 p-2.5 rounded-xl border border-gray-100">
            <span class="text-gray-500 flex items-center gap-1">
              <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-500"></i> Очередь: <b>${m.queueTime}</b>
            </span>
            <span class="text-gray-500 flex items-center gap-1">
              <i data-lucide="phone" class="w-3.5 h-3.5 text-gray-400"></i> ${m.phone}
            </span>
          </div>

          <button onclick="selectMillForDeal('${m.id}')" class="w-full bg-brand-500 hover:bg-brand-600 active:scale-[0.99] text-white font-bold py-2.5 rounded-xl text-xs shadow-md shadow-brand-500/20 transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="flask-conical" class="w-4 h-4"></i> Вызвать экспресс-лабораторию
          </button>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function filterCrops(crop, btn) {
      currentCropFilter = crop;
      document.querySelectorAll('.crop-btn').forEach(b => {
        b.className = 'crop-btn bg-gray-100 text-gray-600 font-medium text-[11px] px-3 py-1.5 rounded-xl whitespace-nowrap';
      });
      btn.className = 'crop-btn active bg-brand-500 text-white font-semibold text-[11px] px-3 py-1.5 rounded-xl whitespace-nowrap shadow-sm';
      renderMills();
    }

    function sortMills(sortType, btn) {
      currentSort = sortType;
      document.querySelectorAll('.sort-btn').forEach(b => {
        b.className = 'sort-btn bg-gray-100 text-gray-600 text-[10px] font-semibold px-2.5 py-1 rounded-lg whitespace-nowrap flex items-center gap-1';
      });
      btn.className = 'sort-btn active bg-gray-900 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg whitespace-nowrap flex items-center gap-1';
      renderMills();
    }

    function fetchRealMills() {
      tg?.HapticFeedback?.notificationOccurred('success');
      renderMills();
    }

    // -------------------------------------------------------------
    // 5. ПОГОДА В РЕГИОНАХ
    // -------------------------------------------------------------
    const weatherData = {
      Kostanay: { temp: '+21°C', humidity: '48%', status: '✅ Идеально для уборки и выгрузки на ток' },
      Sarykol: { temp: '+19°C', humidity: '52%', status: '✅ Погода благоприятная' },
      Fedorovka: { temp: '+22°C', humidity: '42%', status: '✅ Отличные условия для отгрузки' },
      Karasu: { temp: '+18°C', humidity: '60%', status: '⚠️ Возможна роса утренней смены' }
    };

    function updateWeatherWidget() {
      const region = document.getElementById('weather-region-select').value;
      const data = weatherData[region] || weatherData.Kostanay;
      document.getElementById('weather-desc').innerText = `🌡 ${data.temp} • Влажность воздуха: ${data.humidity}`;
      document.getElementById('weather-status').innerText = data.status;
    }

    // -------------------------------------------------------------
    // 6. ОФОРМЛЕНИЕ ЗАЯВКИ ФЕРМЕРОМ
    // -------------------------------------------------------------
    function selectMillForDeal(millId) {
      selectedMill = mockMills.find(m => m.id === millId);
      if (!selectedMill) return;

      document.getElementById('selected-mill-title').innerText = selectedMill.name;
      document.getElementById('selected-crop-title').innerText = `${selectedMill.crop} • ${selectedMill.price.toLocaleString()} ₸/т`;
      calculateDeal();
      goToScreen('screen-lab-request');
    }

    function setVolume(vol) {
      document.getElementById('volume-input').value = vol;
      document.querySelectorAll('.vol-btn').forEach(b => {
        b.className = 'vol-btn border border-gray-200 py-2 rounded-xl text-xs font-bold text-gray-700';
      });
      event.target.className = 'vol-btn border-2 border-brand-500 bg-brand-50 py-2 rounded-xl text-xs font-bold text-brand-500';
      calculateDeal();
    }

    function calculateDeal() {
      const vol = parseFloat(document.getElementById('volume-input').value) || 0;
      const price = selectedMill ? selectedMill.price : 92000;
      const total = vol * price;
      document.getElementById('calc-farmer-payout').innerText = `${total.toLocaleString()} ₸`;
    }

    function requestTelegramContact() {
      if (tg?.requestContact) {
        tg.requestContact((sent) => {
          if (sent && tg.initDataUnsafe?.user) {
            document.getElementById('farmer-phone-input').value = '+7 (707) 888-77-66';
          }
        });
      } else {
        alert('Поделитесь контактом в приложении Telegram');
      }
    }

    function getGPSLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const locStr = `Координаты: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            document.getElementById('location-input').value = locStr;
            tg?.HapticFeedback?.notificationOccurred('success');
          },
          () => alert('Не удалось получить геопозицию. Введите адрес вручную.')
        );
      }
    }

    function submitLabRequest() {
      const farmerName = document.getElementById('farmer-name-input').value || 'Фермер';
      const farmerPhone = document.getElementById('farmer-phone-input').value || '+7 (777) 000-00-00';
      const volume = parseFloat(document.getElementById('volume-input').value) || 60;
      const location = document.getElementById('location-input').value || 'Ток №1';

      const newOrder = {
        id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
        millName: selectedMill ? selectedMill.name : 'ТОО «Аруана-2010»',
        crop: selectedMill ? selectedMill.crop : 'Пшеница 3',
        price: selectedMill ? selectedMill.price : 92000,
        volume: volume,
        totalPayout: volume * (selectedMill ? selectedMill.price : 92000),
        farmerName: farmerName,
        farmerPhone: farmerPhone,
        location: location,
        status: 'PENDING_LAB',
        createdAt: new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        labData: null,
        weighingData: null
      };

      orders.unshift(newOrder);
      tg?.HapticFeedback?.notificationOccurred('success');
      alert('✅ Заявка создана! Лаборант уведомлен и выезжает на ток.');
      renderOrders();
      goToScreen('screen-orders');
    }

    // -------------------------------------------------------------
    // 7. МОИ ЗАЯВКИ (ФЕРМЕР)
    // -------------------------------------------------------------
    function renderOrders() {
      const container = document.getElementById('farmer-orders-list');
      if (orders.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-8 text-xs">У вас пока нет активных заявок.</div>`;
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-extrabold text-brand-600 bg-brand-50 px-2 py-0.5 rounded-md">${o.id}</span>
              <h4 class="font-extrabold text-sm text-gray-900 mt-1">${o.millName}</h4>
              <p class="text-[11px] text-gray-400">${o.crop} • ${o.volume} т</p>
            </div>
            <div class="text-right">
              ${getStatusBadge(o.status)}
              <div class="text-[10px] text-gray-400 mt-1">${o.createdAt}</div>
            </div>
          </div>

          <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-100 text-xs space-y-1">
            <div class="flex justify-between text-gray-600">
              <span>Сумма сделки:</span>
              <span class="font-bold text-gray-900">${o.totalPayout.toLocaleString()} ₸</span>
            </div>
            <div class="flex justify-between text-gray-600">
              <span>Локация:</span>
              <span class="font-semibold text-gray-800">${o.location}</span>
            </div>
          </div>

          <div class="flex gap-2">
            ${o.labData ? `
              <button onclick="openPassportModal('${o.id}')" class="w-1/2 bg-brand-50 text-brand-700 font-bold py-2 rounded-xl text-xs border border-brand-500/20 flex items-center justify-center gap-1">
                <i data-lucide="file-check-2" class="w-3.5 h-3.5"></i> Паспорт
              </button>
              <button onclick="openTtnModal('${o.id}')" class="w-1/2 bg-gray-900 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1">
                <i data-lucide="truck" class="w-3.5 h-3.5"></i> ЭТТН
              </button>
            ` : `
              <div class="w-full text-center text-[11px] text-amber-600 bg-amber-50 py-2 rounded-xl font-medium">
                ⏳ Ожидается замер экспресс-лаборатории
              </div>
            `}
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function getStatusBadge(status) {
      if (status === 'PENDING_LAB') {
        return `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full">🧪 Лаборант в пути</span>`;
      } else if (status === 'READY_FOR_WEIGH') {
        return `<span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full">🚛 Ожидает на весовой</span>`;
      } else if (status === 'COMPLETED') {
        return `<span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full">✅ Оплачено / Закрыто</span>`;
      }
      return '';
    }

    // -------------------------------------------------------------
    // 8. ПАНЕЛЬ ЛАБОРАНТА
    // -------------------------------------------------------------
    let labFilter = 'ALL';

    function renderLabOrders() {
      const container = document.getElementById('lab-orders-list');
      let filtered = [...orders];

      if (labFilter === 'PENDING') filtered = filtered.filter(o => o.status === 'PENDING_LAB');
      if (labFilter === 'COMPLETED') filtered = filtered.filter(o => o.status !== 'PENDING_LAB');

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-8 text-xs">Заявок для лаборатории не найдено.</div>`;
        return;
      }

      container.innerHTML = filtered.map(o => `
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-extrabold text-brand-600 bg-brand-50 px-2 py-0.5 rounded-md">${o.id}</span>
              <h4 class="font-extrabold text-sm text-gray-900 mt-1">${o.farmerName}</h4>
              <p class="text-[11px] text-gray-500">${o.location} • Тел: ${o.farmerPhone}</p>
            </div>
            ${getStatusBadge(o.status)}
          </div>

          <div class="text-xs bg-gray-50 p-2 rounded-xl text-gray-600 flex justify-between">
            <span>Закупщик: <b>${o.millName}</b></span>
            <span>Объём: <b>${o.volume} т</b></span>
          </div>

          ${o.status === 'PENDING_LAB' ? `
            <button onclick="openLabModal('${o.id}')" class="w-full bg-brand-500 text-white font-bold py-2.5 rounded-xl text-xs shadow-sm flex items-center justify-center gap-1.5">
              <i data-lucide="flask-conical" class="w-4 h-4"></i> Внести результаты замера
            </button>
          ` : `
            <button onclick="openPassportModal('${o.id}')" class="w-full bg-gray-100 text-gray-700 font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1">
              <i data-lucide="file-check-2" class="w-4 h-4"></i> Просмотр выданного Паспорта
            </button>
          `}
        </div>
      `).join('');

      lucide.createIcons();
    }

    function filterLabOrders(filter, btn) {
      labFilter = filter;
      document.querySelectorAll('.lab-filter-btn').forEach(b => {
        b.className = 'lab-filter-btn bg-gray-100 text-gray-600 text-xs font-semibold px-3 py-1.5 rounded-xl';
      });
      btn.className = 'lab-filter-btn active bg-gray-900 text-white text-xs font-bold px-3 py-1.5 rounded-xl';
      renderLabOrders();
    }

    function openLabModal(orderId) {
      activeLabOrder = orders.find(o => o.id === orderId);
      if (!activeLabOrder) return;

      document.getElementById('modal-order-id').innerText = `Замер для ${activeLabOrder.id}`;
      document.getElementById('modal-order-sub').innerText = `${activeLabOrder.farmerName} (${activeLabOrder.volume} т)`;
      document.getElementById('lab-modal').classList.remove('hidden');
    }

    function closeLabModal() {
      document.getElementById('lab-modal').classList.add('hidden');
    }

    function saveLabPassport() {
      if (!activeLabOrder) return;

      const gluten = parseFloat(document.getElementById('lab-gluten').value) || 25.0;
      const moisture = parseFloat(document.getElementById('lab-moisture').value) || 13.5;
      const testweight = parseInt(document.getElementById('lab-testweight').value) || 765;
      const trash = parseFloat(document.getElementById('lab-trash').value) || 1.2;

      activeLabOrder.labData = { gluten, moisture, testweight, trash };
      activeLabOrder.status = 'READY_FOR_WEIGH';

      closeLabModal();
      tg?.HapticFeedback?.notificationOccurred('success');
      alert('✅ Паспорт качества сформирован и привязан к ЭТТН!');
      renderLabOrders();
      renderOrders();
    }

    // -------------------------------------------------------------
    // 9. ПАНЕЛЬ ВЕСОВОЙ МЕЛЬНИЦЫ
    // -------------------------------------------------------------
    let millFilter = 'ALL';

    function renderMillOrders() {
      const container = document.getElementById('mill-orders-list');
      let filtered = [...orders];

      if (millFilter === 'READY') filtered = filtered.filter(o => o.status === 'READY_FOR_WEIGH');
      if (millFilter === 'PAID') filtered = filtered.filter(o => o.status === 'COMPLETED');

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-400 py-8 text-xs">Машин на весовой не найдено.</div>`;
        return;
      }

      container.innerHTML = filtered.map(o => `
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-extrabold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">${o.id}</span>
              <h4 class="font-extrabold text-sm text-gray-900 mt-1">${o.farmerName}</h4>
              <p class="text-[11px] text-gray-500">${o.crop} • Заявлено: ${o.volume} т</p>
            </div>
            ${getStatusBadge(o.status)}
          </div>

          ${o.status === 'READY_FOR_WEIGH' ? `
            <button onclick="openMillModal('${o.id}')" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-sm flex items-center justify-center gap-1.5">
              <i data-lucide="scale" class="w-4 h-4"></i> Зафиксировать вес и закрыть сделку
            </button>
          ` : `
            <div class="text-xs bg-emerald-50 p-2.5 rounded-xl text-emerald-800 font-medium">
              💰 Принято фактический вес: <b>${o.weighingData?.factWeight || o.volume} т</b> • Оплачено
            </div>
          `}
        </div>
      `).join('');

      lucide.createIcons();
    }

    function filterMillOrders(filter, btn) {
      millFilter = filter;
      document.querySelectorAll('.mill-filter-btn').forEach(b => {
        b.className = 'mill-filter-btn bg-gray-100 text-gray-600 text-xs font-semibold px-3 py-1.5 rounded-xl';
      });
      btn.className = 'mill-filter-btn active bg-gray-900 text-white text-xs font-bold px-3 py-1.5 rounded-xl';
      renderMillOrders();
    }

    function openMillModal(orderId) {
      activeMillOrder = orders.find(o => o.id === orderId);
      if (!activeMillOrder) return;

      document.getElementById('mill-modal-title').innerText = `Взвешивание ${activeMillOrder.id}`;
      document.getElementById('mill-modal-sub').innerText = activeMillOrder.farmerName;
      document.getElementById('mill-fact-weight').value = activeMillOrder.volume;
      document.getElementById('mill-modal-price').innerText = `${activeMillOrder.price.toLocaleString()} ₸/т`;
      document.getElementById('mill-modal-total').innerText = `${activeMillOrder.totalPayout.toLocaleString()} ₸`;

      document.getElementById('mill-modal').classList.remove('hidden');
    }

    function closeMillModal() {
      document.getElementById('mill-modal').classList.add('hidden');
    }

    function confirmMillWeighing() {
      if (!activeMillOrder) return;

      const factWeight = parseFloat(document.getElementById('mill-fact-weight').value) || activeMillOrder.volume;
      activeMillOrder.weighingData = { factWeight };
      activeMillOrder.totalPayout = factWeight * activeMillOrder.price;
      activeMillOrder.status = 'COMPLETED';

      closeMillModal();
      tg?.HapticFeedback?.notificationOccurred('success');
      alert('✅ Сделка успешно закрыта! Средства переведены фермеру.');
      renderMillOrders();
      renderOrders();
    }

    // -------------------------------------------------------------
    // 10. МОДАЛЬНЫЕ ОКНА: ПАСПОРТ, ЭТТН, ГРАФИК
    // -------------------------------------------------------------
    function openPassportModal(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (!order || !order.labData) {
        alert('Паспорт еще не сформирован лаборантом.');
        return;
      }

      document.getElementById('p-doc-id').innerText = `ПАСПОРТ ${order.id}`;
      document.getElementById('p-date').innerText = order.createdAt.split(' ')[0];
      document.getElementById('p-mill').innerText = order.millName;
      document.getElementById('p-crop').innerText = order.crop;
      document.getElementById('p-farmer').innerText = order.farmerName;
      document.getElementById('p-volume').innerText = `${order.volume} тонн`;
      document.getElementById('p-location').innerText = order.location;

      document.getElementById('p-gluten').innerText = `${order.labData.gluten}%`;
      document.getElementById('p-moisture').innerText = `${order.labData.moisture}%`;
      document.getElementById('p-testweight').innerText = `${order.labData.testweight} г/л`;
      document.getElementById('p-trash').innerText = `${order.labData.trash}%`;

      document.getElementById('passport-modal').classList.remove('hidden');
    }

    function closePassportModal() {
      document.getElementById('passport-modal').classList.add('hidden');
    }

    function openTtnModal(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (!order) return;

      document.getElementById('ttn-id').innerText = `ЭТТН #${order.id.replace('ORD-', '')}`;
      document.getElementById('ttn-farmer').innerText = order.farmerName;
      document.getElementById('ttn-mill').innerText = order.millName;
      document.getElementById('ttn-cargo').innerText = `${order.crop} (${order.volume} т)`;
      document.getElementById('ttn-route').innerText = `${order.location} ➔ ${order.millName}`;
      document.getElementById('ttn-weight-val').innerText = `${order.volume} т`;

      document.getElementById('ttn-modal').classList.remove('hidden');
    }

    function closeTtnModal() {
      document.getElementById('ttn-modal').classList.add('hidden');
    }

    function openChartModal(millName, currentPrice) {
      document.getElementById('chart-mill-name').innerText = millName;
      document.getElementById('stat-current').innerText = `${currentPrice.toLocaleString()} ₸`;
      document.getElementById('stat-max').innerText = `${(currentPrice + 2500).toLocaleString()} ₸`;
      document.getElementById('stat-min').innerText = `${(currentPrice - 3000).toLocaleString()} ₸`;

      document.getElementById('chart-modal').classList.remove('hidden');
    }

    function closeChartModal() {
      document.getElementById('chart-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
